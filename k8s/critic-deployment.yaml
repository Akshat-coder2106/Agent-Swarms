apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-critic
  namespace: sentinel
  labels:
    app: sentinel
    component: critic
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sentinel
      component: critic
  template:
    metadata:
      labels:
        app: sentinel
        component: critic
    spec:
      serviceAccountName: sentinel-sa
      containers:
      - name: critic
        image: sentinel-critic:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"
        envFrom:
        - configMapRef:
            name: sentinel-config
        env:
        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: sentinel-secrets
              key: google-api-key
        - name: QDRANT_HOST
          valueFrom:
            configMapKeyRef:
              name: sentinel-config
              key: qdrant-host
        - name: NEO4J_URI
          valueFrom:
            configMapKeyRef:
              name: sentinel-config
              key: neo4j-uri
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sentinel-critic-hpa
  namespace: sentinel
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sentinel-critic
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Pods
    pods:
      metric:
        name: kafka_consumer_lag
      target:
        type: AverageValue
        averageValue: "100"
