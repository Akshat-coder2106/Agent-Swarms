apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  namespace: sentinel
  labels:
    app: sentinel
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: sentinel
    component: api
