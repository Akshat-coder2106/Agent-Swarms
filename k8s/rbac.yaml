apiVersion: v1
kind: ServiceAccount
metadata:
  name: sentinel-sa
  namespace: sentinel
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sentinel-role
  namespace: sentinel
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sentinel-rolebinding
  namespace: sentinel
subjects:
- kind: ServiceAccount
  name: sentinel-sa
  namespace: sentinel
roleRef:
  kind: Role
  name: sentinel-role
  apiGroup: rbac.authorization.k8s.io
