global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'sentinel-api'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - sentinel
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: sentinel
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_component]
        target_label: component

  - job_name: 'sentinel-architect'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - sentinel
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: architect
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'sentinel-scout'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - sentinel
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: scout
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'sentinel-engineer'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - sentinel
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: engineer
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'sentinel-critic'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - sentinel
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_component]
        action: keep
        regex: critic
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
