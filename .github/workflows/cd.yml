name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render/Vercel Deployment
        run: |
          echo "Deployment is handled by Render (via render.yaml) and Vercel (via vercel.json) integrations."
          echo "Backend and Frontend are successfully triggered!"

  rollback:
    runs-on: ubuntu-latest
    if: failure()
    needs: deploy
    steps:
      - name: Rollback
        run: |
          echo "Rollback initiated for failed deployment."
