name: Sentinel Audit

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Sentinel audit
        run: |
          python - <<'PY'
          import json
          from sentinel.config import load_settings
          from sentinel.memory import RepositoryIngestor

          memory = RepositoryIngestor(load_settings()).ingest(".")
          with open("audit-report.json", "w", encoding="utf-8") as report:
              json.dump(
                  {
                      "files_indexed": memory.files_indexed,
                      "findings": [finding.model_dump(mode="json") for finding in memory.findings],
                  },
                  report,
                  indent=2,
              )
          PY

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit-report.json

      - name: Comment PR with findings
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));
            const findings = report.findings || [];
            
            let comment = `## 🔍 Sentinel Security Audit\n\n`;
            comment += `**Total Findings:** ${findings.length}\n\n`;
            
            if (findings.length > 0) {
              comment += `### Critical Findings\n\n`;
              findings.filter(f => f.severity === 'CRITICAL').forEach(f => {
                comment += `- **${f.rule_id}**: ${f.title}\n`;
                comment += `  - File: ${f.file_path}:${f.line}\n`;
                comment += `  - Remediation: ${f.remediation}\n\n`;
              });
              
              comment += `### High Severity Findings\n\n`;
              findings.filter(f => f.severity === 'HIGH').forEach(f => {
                comment += `- **${f.rule_id}**: ${f.title}\n`;
                comment += `  - File: ${f.file_path}:${f.line}\n\n`;
              });
            } else {
              comment += `✅ No security findings detected.\n`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Fail on critical findings
        if: github.event_name == 'pull_request'
        run: |
          python -c "
          import json
          with open('audit-report.json') as f:
              report = json.load(f)
          critical = [f for f in report.get('findings', []) if f.get('severity') == 'CRITICAL']
          if critical:
              print(f'Found {len(critical)} critical findings')
              exit(1)
          "

  pr-gate:
    runs-on: ubuntu-latest
    needs: audit
    if: github.event_name == 'pull_request'
    steps:
      - name: Check for critical findings
        run: |
          echo "PR gate check passed - no critical findings"
