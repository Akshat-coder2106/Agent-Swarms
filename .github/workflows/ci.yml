name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --cov=backend/sentinel --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          ruff check backend tests

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build:
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images
        run: |
          docker buildx build --load -t ghcr.io/${{ github.repository }}/sentinel-api:latest -f docker/Dockerfile.api .
          docker buildx build --load -t ghcr.io/${{ github.repository }}/sentinel-architect:latest -f docker/Dockerfile.architect .
          docker buildx build --load -t ghcr.io/${{ github.repository }}/sentinel-scout:latest -f docker/Dockerfile.scout .
          docker buildx build --load -t ghcr.io/${{ github.repository }}/sentinel-engineer:latest -f docker/Dockerfile.engineer .
          docker buildx build --load -t ghcr.io/${{ github.repository }}/sentinel-critic:latest -f docker/Dockerfile.critic .

      - name: Push images
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/${{ github.repository }}/sentinel-api:latest
          docker push ghcr.io/${{ github.repository }}/sentinel-architect:latest
          docker push ghcr.io/${{ github.repository }}/sentinel-scout:latest
          docker push ghcr.io/${{ github.repository }}/sentinel-engineer:latest
          docker push ghcr.io/${{ github.repository }}/sentinel-critic:latest
