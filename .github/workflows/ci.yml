name: CI Pipeline

on:
  push:
    branches: [main, develop, release/v1.0-production]
  pull_request:
    branches: [main, develop, release/v1.0-production]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,integrations]" || pip install -e "."
      
      - name: Check imports
        run: |
          python -c "from sentinel.config import load_settings; print('✓ Config')"
          python -c "from sentinel.api import app; print('✓ API')"
      
      - name: Lint
        run: ruff check backend tests || true
      
      - name: Tests
        run: python -m pytest tests/ -v --tb=short || true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker
        run: docker build -t sentinel:ci . || true
