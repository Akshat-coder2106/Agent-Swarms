[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-sentinel"
version = "0.1.0"
description = "Autonomous codebase auditing and remediation swarm - Production v4.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "jsonschema>=4.23.0",
  "semantic-kernel>=1.0.0",
  "azure-ai-inference>=1.0.0b3",
  "pyautogen>=0.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.8",
  "pytest-cov>=5.0",
]

integrations = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "anthropic>=0.40.0",
  "qdrant-client>=1.12.0",
  "neo4j>=5.25.0",
  "sentence-transformers>=3.0.0",
  "tree-sitter>=0.22.0",
  "temporalio>=1.8.0",
  "kafka-python>=2.0.2",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "prometheus-client>=0.21.0",
  "gitpython>=3.1.43",
  "wasmtime>=23.0.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pyright]
include = ["backend"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101", "S105", "B008", "E501", "F841", "S110", "S603", "S607", "F821"]

[tool.ruff.lint.per-file-ignores]
"backend/sandbox_service/image_builder.py" = ["S108"]
"backend/sandbox_service/vm_manager.py" = ["S108"]
"backend/sentinel/checkov_scanner.py" = ["S603"]
"backend/sentinel/config.py" = ["S108"]
"backend/sentinel/cve_scanner.py" = ["S310", "S603", "S607"]
"backend/sentinel/firecracker_sandbox.py" = ["S108", "S603", "S607"]
"backend/sentinel/gitleaks_scanner.py" = ["S603"]
"backend/sentinel/llm.py" = ["S310", "S323"]
"backend/sentinel/sbom_generator.py" = ["S603", "S607"]
"backend/sentinel/semgrep_scanner.py" = ["S603"]
"backend/sentinel/trivy_scanner.py" = ["S603"]
"backend/sentinel/wasmtime_sandbox.py" = ["S603", "S607"]
